name: check

# Runs tools/check.py on every pull request and on main. Read-only: the job gets no write access and
# no secrets, so a pull request from anyone can run it safely.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conformance cases
        run: python3 tools/check.py --self-test
      - name: Packs and index
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 tools/check.py ${BASE:+--base "$BASE"}
